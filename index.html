<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.22em;pointer-events:none;white-space:nowrap;animation:pulse 2.5s ease-in-out infinite;transition:opacity .6s}
#hint.off{opacity:0!important;animation:none}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.65}}
#vc{position:fixed;bottom:14px;right:16px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.5);font-size:12px;pointer-events:none;z-index:5}
#vc svg{width:14px;height:14px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
audio{display:none}

/* real profile picture + decoration */
#pf{position:fixed;left:0;top:0;z-index:3;pointer-events:none;opacity:0;transform:scale(.88);transition:opacity .9s ease .3s,transform .9s cubic-bezier(.2,.8,.2,1) .3s}
#pf.in{opacity:1;transform:none}
#pfa{position:absolute;left:8.333%;top:8.333%;width:83.333%;height:83.333%;border-radius:50%;object-fit:cover;box-shadow:0 0 44px rgba(170,110,255,.5)}
#pfd{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

#info{position:fixed;left:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px;overflow:hidden;pointer-events:none;opacity:0;transform-origin:top center;transition:opacity .9s ease .4s;z-index:4}
#info.in{opacity:1}
#nm{font-size:24px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;text-shadow:0 0 22px rgba(170,110,255,.8)}
.dot{width:12px;height:12px;border-radius:50%;background:#747f8d}
.dot.online{background:#23a55a;box-shadow:0 0 12px #23a55a}.dot.idle{background:#f0b232;box-shadow:0 0 12px #f0b232}.dot.dnd{background:#f23f43;box-shadow:0 0 12px #f23f43}
#un{font-size:13px;letter-spacing:.12em;opacity:.65;margin-top:-4px}
#acts{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:340px;margin-top:6px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.act{display:flex;gap:12px;align-items:center;width:100%;border-radius:18px;padding:10px 14px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.act img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.act .t{min-width:0;font-size:12px;line-height:1.45}
.act .t b{display:block;font-size:10px;letter-spacing:.14em;opacity:.7;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:12px;text-align:center;border-radius:999px;padding:6px 16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:rise .6s ease both}

/* social dock */
#dock{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px);display:flex;gap:6px;padding:8px;border-radius:22px;z-index:6;opacity:0;pointer-events:none;transition:opacity .7s ease .9s,transform .7s cubic-bezier(.2,.8,.2,1) .9s}
#dock.in{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.06);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.ico:hover,.ico:focus-visible{transform:translateY(-5px) scale(1.14);background:rgba(170,110,255,.28);box-shadow:0 8px 22px rgba(170,110,255,.45);outline:none}
.ico:active{transform:scale(.94)}
.ico svg,#mute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:currentColor;stroke:none}

/* mute toggle */
#mute{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);cursor:pointer;z-index:7;border:1px solid rgba(255,255,255,.2);transition:transform .2s,color .2s}
#mute:hover{transform:scale(1.1);color:#fff}
#mute svg{width:18px;height:18px}
#mute:not(.muted) .x,#mute.muted .w{display:none}

@media (prefers-reduced-motion:reduce){.ico,#dock,#pf{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<span id="hint">click</span>

<div id="pf"><img id="pfa" alt=""><img id="pfd" alt=""></div>

<div id="info"><div id="nm"><span class="dot" id="dot"></span><span id="dn"></span></div><div id="un"></div><div id="acts"></div></div>

<nav id="dock" class="glass" aria-label="Social links">
  <a class="ico" href="https://instagram.com/eunsoulja" target="_blank" rel="noopener noreferrer" aria-label="Instagram @eunsoulja" title="@eunsoulja">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle class="f" cx="17.4" cy="6.6" r="1.1"/></svg>
  </a>
</nav>

<button id="mute" class="glass" aria-label="Toggle sound" title="Sound">
  <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path class="w" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<div id="vc"><svg viewBox="0 0 24 24"><path d="M1.5 12s4-7 10.5-7 10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg><span id="vcn">—</span></div>
<audio id="bg" src="https://file.garden/am9m147l3hw3nqT1/cinderella" loop autoplay playsinline preload="auto"></audio>

<script>
(function(){
"use strict";
var ID="1521890728094208122";

/* light protection */
document.addEventListener("contextmenu",function(e){e.preventDefault()},true);
document.addEventListener("dragstart",function(e){e.preventDefault()},true);
document.addEventListener("keydown",function(e){
  var k=(e.key||"").toLowerCase();
  if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&"ijck".indexOf(k)>-1)||(e.ctrlKey&&k.length===1&&"usp".indexOf(k)>-1))e.preventDefault();
},true);

/* view counter */
try{
  var n=parseInt(localStorage.getItem("views")||"0",10)||0;
  if(!sessionStorage.getItem("viewed")){n++;localStorage.setItem("views",n);sessionStorage.setItem("viewed","1");}
  document.getElementById("vcn").textContent=n<1000?n:(n/1000).toFixed(1)+"k";
}catch(e){document.getElementById("vcn").textContent="1";}

/* ---------- sound: soft synthesized UI sounds + remembered mute ---------- */
var bg=document.getElementById("bg"),muteBtn=document.getElementById("mute"),muted=false,AC=null;
try{muted=localStorage.getItem("muted")==="1"}catch(e){}
function applyMute(){muteBtn.classList.toggle("muted",muted);bg.muted=muted;muteBtn.setAttribute("aria-pressed",muted)}
function audioCtx(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function tone(f1,f2,dur,vol,delay){
  if(muted)return;var a=audioCtx();if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(delay||0);
  o.type="sine";o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(f2,s+dur);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
  o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+dur+.03);
}
function sHover(){tone(1250,1600,.07,.03)}
function sClick(){tone(480,760,.09,.07);tone(760,1020,.12,.05,.05)}
function wire(el){el.addEventListener("mouseenter",sHover);el.addEventListener("click",sClick)}
Array.prototype.forEach.call(document.querySelectorAll("#dock .ico"),wire);
muteBtn.addEventListener("mouseenter",sHover);
muteBtn.addEventListener("click",function(e){
  e.stopPropagation();
  muted=!muted;try{localStorage.setItem("muted",muted?"1":"0")}catch(x){}
  applyMute();sClick();
});
applyMute();

/* ---------- ascii banner ---------- */
var ART=[
"█▓▄▄         ▄▄       █▓▄▄          █▓▒▄▄ ▄▄▒▓█       ▄▄   ",
"▓▒░█▀▀▄▄▄   ▓▒░▀▀▄▄   ▓▒░█▀  ▐▒▌   ▐▓▒░█   █░▒▓▌     ▓▒░█  ",
"▐░████ ▒░▀▌ ▒░█████▀▄ ▐░██▌  ▒░    ▓▒░█     █░▒▓    ▐▒░██▌ ",
" ████▓ ▀▀▀  ▐░███▀███ ▐███  ▐░▌   ▐▒░█▌     ▐█░▒▌   ▒░████ ",
"  ▀▀▀▀██▄    ███▌ ▐█▌  ██▌  ██    ▒░ ▌       ▐ ░▒  ▐░███ █▌",
" ██▓▒ ▐███   ▐███ ██   ▀██▄██    ▐░███▄▄▄ ▄▄▄███░▌ ████▀▀██",
"  ▀▀▀▀▀▀▀     ▀▀▀▀▀      ▀▀▀       ▀▀▀▀▀   ▀▀▀▀▀    ▀▀   ▀ "
];
var cv=document.getElementById("cv"),ctx=cv.getContext("2d",{alpha:false});
var info=document.getElementById("info"),dock=document.getElementById("dock");
var pf=document.getElementById("pf"),pfa=document.getElementById("pfa"),pfd=document.getElementById("pfd");
var W,H,cw,ch,S,A=[],mx=-9999,my=-9999,sx=0,sy=0,t=0,last=performance.now();
var entered=false,ay=0,ap=0,ayT=0,pcyV=0;

function buildArt(){
  A=[];
  ART.forEach(function(l,r){for(var c=0;c<l.length;c++){if(l[c]===" ")continue;
    A.push({c:l[c],col:c,row:r,x:W/2,y:H/2,vx:0,vy:0,g:0,hx:0,hy:0});}});
}
function fit(){
  var top=pcyV+S*.5+H*.012;info.style.top=top+"px";info.style.transform="none";
  var k=Math.min(1,(H-top-98)/Math.max(1,info.scrollHeight));
  info.style.transform="scale("+Math.max(.45,k)+")";
}
function geom(){
  var cols=0,rows=ART.length;ART.forEach(function(l){if(l.length>cols)cols=l.length});
  cw=Math.max(3,Math.min(10,W*.7/cols,H*.17/(rows*1.65)));ch=cw*1.65;
  A.forEach(function(p){p.bx=(p.col-cols/2)*cw;p.by=(p.row-rows/2)*ch;});
  S=Math.max(90,Math.min(W*.46,H*.24,210));
  var artH=rows*ch;ayT=H*.04+artH/2;pcyV=ayT+artH/2+H*.025+S*.5;
  pf.style.width=pf.style.height=S+"px";pf.style.left=(W/2-S/2)+"px";pf.style.top=(pcyV-S/2)+"px";
  fit();
}
function resize(){
  W=innerWidth;H=innerHeight;var d=Math.min(devicePixelRatio||1,1.25);
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  if(!A.length)buildArt();
  ay=entered?ayT:H/2;mx=sx=W/2;my=sy=H/2;geom();
}
addEventListener("resize",resize);
addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY},{passive:true});
addEventListener("touchmove",function(e){mx=e.touches[0].clientX;my=e.touches[0].clientY},{passive:true});
resize();

function step(p,tx,ty,dt){
  p.vx+=(tx-p.x)*.02*dt;p.vy+=(ty-p.y)*.02*dt;
  var dm=Math.pow(.9,dt);p.vx*=dm;p.vy*=dm;p.x+=p.vx*dt;p.y+=p.vy*dt;
}
function frame(now){
  var dt=Math.min((now-last)/16.67,2);last=now;t+=.016*dt;
  sx+=(mx-sx)*.055;sy+=(my-sy)*.055;
  ay+=((entered?ayT:H/2)-ay)*.05*dt;
  ap+=((entered?1:0)-ap)*.04*dt;
  var ox=Math.max(-120,Math.min(120,(sx-W/2)*.12)),oy=Math.max(-120,Math.min(120,(sy-H/2)*.12));
  var i,p;
  for(i=0;i<A.length;i++){p=A[i];p.hx=W/2+p.bx;p.hy=ay+p.by;}
  var near=null,nd=1e9;
  for(i=0;i<A.length;i++){p=A[i];var d=(p.x-sx)*(p.x-sx)+(p.y-sy)*(p.y-sy);if(d<nd){nd=d;near=p}}
  if(near&&nd<22500){var f=1-Math.sqrt(nd)/150;f=f*f*(3-2*f);
    near.vx+=(sx-near.x)*.55*f;near.vy+=(sy-near.y)*.55*f;
    for(i=0;i<A.length;i++){p=A[i];if(p===near)continue;var dx=near.x-p.x,dy=near.y-p.y,d2=dx*dx+dy*dy;
      if(d2<13225){var s=1-Math.sqrt(d2)/115;s*=s;p.vx+=dx*.1*s;p.vy+=dy*.1*s;}}}
  ctx.globalAlpha=1;ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.textBaseline="top";
  var bh=(t*6)%360;
  if(ap>.01){var gr=ctx.createRadialGradient(W/2,pcyV,0,W/2,pcyV,S*1.8);
    gr.addColorStop(0,"hsla("+((bh+270)%360)+",85%,55%,"+(.26*ap)+")");gr.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  ctx.font=(cw*.85)+"px monospace";
  for(i=0;i<A.length;i++){p=A[i];
    step(p,p.hx+Math.sin(t*1.4+p.hx*.018+p.hy*.012)*4+ox*.5,p.hy+Math.cos(t*1.1+p.hy*.02+p.hx*.009)*3+oy*.5,dt);
    var disp=Math.hypot(p.x-p.hx,p.y-p.hy);p.g+=(Math.min(1,disp/30)-p.g)*.12*dt;
    var gw=Math.min(1,disp/18),v=p.g,hue=(bh+Math.sin(p.hx*.006+p.hy*.004+t*.3)*14+360)%360;
    var h=hue*(1-v)+275*v,s2=(42+gw*15)*(1-v)+75*v,l=(60+gw*35)*(1-v)+62*v;
    ctx.globalAlpha=.9;ctx.fillStyle="hsl("+h+","+s2+"%,"+l+"%)";ctx.fillText(p.c,p.x,p.y);}
  ctx.globalAlpha=1;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* music */
bg.volume=1;
function play(){var p=bg.play();if(p)p.catch(function(){})}
addEventListener("load",play);
["click","keydown","mousemove","touchstart"].forEach(function(ev){document.addEventListener(ev,play,{once:true,passive:true})});
setInterval(function(){if(bg.paused)play()},1000);

/* lanyard */
var acts=document.getElementById("acts"),lastKey="";
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function actImg(a){
  var i=a.assets&&a.assets.large_image;if(!i)return null;
  if(i.indexOf("mp:external/")===0)return "https://media.discordapp.net/external/"+i.slice(12);
  if(i.indexOf("mp:")===0)return "https://media.discordapp.net/"+i.slice(3);
  if(i.indexOf("spotify:")===0)return "https://i.scdn.co/image/"+i.slice(8);
  return a.application_id?"https://cdn.discordapp.com/app-assets/"+a.application_id+"/"+i+".png":null;
}
var TYPES=["Playing","Streaming","Listening to","Watching","","Competing in"];
function render(d){
  var u=d.discord_user;if(!u)return;
  var name=u.global_name||u.display_name||u.username;
  document.getElementById("dn").textContent=name;
  document.getElementById("un").textContent="@"+u.username;
  document.getElementById("dot").className="dot "+(d.discord_status||"offline");
  document.title="@"+u.username;
  var hint=document.getElementById("hint");if(!entered)hint.textContent="click · pwned by @"+u.username;

  /* real avatar (animated if it's a gif avatar) + real decoration on top */
  var ext=u.avatar&&u.avatar.indexOf("a_")===0?"gif":"png";
  var av=u.avatar?"https://cdn.discordapp.com/avatars/"+u.id+"/"+u.avatar+"."+ext+"?size=256":"https://cdn.discordapp.com/embed/avatars/0.png";
  var dd=u.avatar_decoration_data,deco=dd&&dd.asset?"https://cdn.discordapp.com/avatar-decoration-presets/"+dd.asset+".png?size=256&passthrough=true":"";
  if(av+deco!==lastKey){
    lastKey=av+deco;pfa.src=av;
    if(deco){pfd.src=deco;pfd.style.display="block"}else{pfd.removeAttribute("src");pfd.style.display="none"}
  }

  acts.innerHTML="";
  (d.activities||[]).slice(0,3).forEach(function(a){
    if(a.type===4){var s=(a.emoji&&a.emoji.name?a.emoji.name+" ":"")+(a.state||"");if(s.trim())acts.appendChild(el("div","cs glass",s));return;}
    var card=el("div","act glass"),im=actImg(a);
    if(a.name==="Spotify"&&d.spotify&&d.spotify.album_art_url)im=d.spotify.album_art_url;
    if(im){var i=el("img");i.src=im;i.alt="";card.appendChild(i);}
    var tx=el("div","t");tx.appendChild(el("b","",((TYPES[a.type]||"")+" "+(a.name||"")).trim()));
    if(a.details)tx.appendChild(el("span","",a.details));
    if(a.state)tx.appendChild(el("span","",a.state));
    card.appendChild(tx);acts.appendChild(card);
  });
  fit();
}
fetch("https://api.lanyard.rest/v1/users/"+ID).then(function(r){return r.json()}).then(function(j){if(j&&j.success)render(j.data)}).catch(function(){});
function connect(){
  var ws,hb;
  try{ws=new WebSocket("wss://api.lanyard.rest/socket");}catch(e){return;}
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.op===1){hb=setInterval(function(){ws.send(JSON.stringify({op:3}))},m.d.heartbeat_interval);ws.send(JSON.stringify({op:2,d:{subscribe_to_id:ID}}));}
    else if(m.op===0&&m.d)render(m.d);
  };
  ws.onclose=function(){clearInterval(hb);setTimeout(connect,3000)};
}
connect();

/* click: reveal pfp, info and dock */
document.addEventListener("click",function(){
  if(entered)return;entered=true;sClick();
  document.getElementById("hint").classList.add("off");
  pf.classList.add("in");info.classList.add("in");dock.classList.add("in");
},{passive:true});
})();
</script>
</body>
</html>
