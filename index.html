<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>profile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0b0b;font-family:'Courier New',monospace;color:#ffffff}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#bgimg{position:fixed;inset:0;z-index:0;background:url("https://file.garden/am9m147l3hw3nqT1/%E3%82%AA%E3%83%AA%E3%82%AA%E3%83%B3_%E2%99%91.gif") center/cover no-repeat;opacity:0;transition:opacity 1.6s ease}
#bgimg.in{opacity:.6}
#bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.62),rgba(0,0,0,.28) 40%,rgba(0,0,0,.78))}
#hint{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.38);font-size:11px;letter-spacing:.22em;pointer-events:none;white-space:nowrap;animation:pulse 2.5s ease-in-out infinite;transition:opacity .6s}
#hint.off{opacity:0!important;animation:none}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.65}}
#vc{position:fixed;bottom:14px;right:16px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.48);font-size:12px;pointer-events:none;z-index:5}
#vc svg{width:14px;height:14px;stroke:rgba(255,255,255,.48);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
audio{display:none}

/* real profile picture + decoration */
#pf{position:fixed;left:0;top:0;z-index:3;pointer-events:none;opacity:0;transform:scale(.88);perspective:700px;transition:opacity .9s ease .3s,transform .9s cubic-bezier(.2,.8,.2,1) .3s}
#pf.in{opacity:1;transform:none;pointer-events:auto}
#pfi{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d}
#pfb{transform:rotateY(180deg);transform-style:flat}
#pfa,#pfd{backface-visibility:hidden;-webkit-backface-visibility:hidden}
#pfc{width:100%;height:100%;display:block;filter:drop-shadow(0 0 16px rgba(255,255,255,.22))}
#pfa{position:absolute;left:8.333%;top:8.333%;width:83.333%;height:83.333%;border-radius:50%;object-fit:cover;box-shadow:0 0 44px rgba(255,255,255,.20)}
#pfd{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:translateZ(26px)}

#info{position:fixed;left:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px;overflow:hidden;pointer-events:none;opacity:0;transform-origin:top center;transition:opacity .9s ease .4s;z-index:4}
#info.in{opacity:1}
#nm{font-size:24px;letter-spacing:.06em;display:flex;align-items:center;gap:10px;text-shadow:0 0 22px rgba(255,255,255,.30)}
.dot{width:12px;height:12px;border-radius:50%;background:#9a9a9a}
.dot.online{background:#b8b8b8;box-shadow:0 0 12px #b8b8b8}.dot.idle{background:#d0d0d0;box-shadow:0 0 12px #d0d0d0}.dot.dnd{background:#777777;box-shadow:0 0 12px #777777}
#un{font-size:13px;letter-spacing:.12em;opacity:.65;margin-top:-4px}
#acts{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:340px;margin-top:6px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.035));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 32px rgba(0,0,0,.50),inset 0 1px 0 rgba(255,255,255,.20)}
.act{display:flex;gap:12px;align-items:center;width:100%;border-radius:18px;padding:10px 14px;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.act img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.act .t{min-width:0;font-size:12px;line-height:1.45}
.act .t b{display:block;font-size:10px;letter-spacing:.14em;opacity:.7;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:12px;text-align:center;border-radius:999px;padding:6px 16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:rise .6s ease both}

/* social dock */
#dock{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px);display:flex;gap:6px;padding:8px;border-radius:22px;z-index:6;opacity:0;pointer-events:none;transition:opacity .7s ease .9s,transform .7s cubic-bezier(.2,.8,.2,1) .9s}
#dock.in{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#ffffff;background:rgba(255,255,255,.07);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.ico:hover,.ico:focus-visible{transform:translateY(-5px) scale(1.14);background:rgba(255,255,255,.10);box-shadow:0 8px 22px rgba(255,255,255,.24);outline:none}
.ico:active{transform:scale(.94)}
.ico svg,#mute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:currentColor;stroke:none}

/* mute toggle */
#mute{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.72);cursor:pointer;z-index:7;border:1px solid rgba(255,255,255,.16);transition:transform .2s,color .2s}
#mute:hover{transform:scale(1.1);color:#ffffff}
#mute svg{width:18px;height:18px}
#mute:not(.muted) .x,#mute.muted .w{display:none}

/* glass cursor */
#cr,#cd{position:fixed;left:0;top:0;pointer-events:none;z-index:99;opacity:0}
#cr{width:34px;height:34px;border-radius:50%;transition:opacity .3s,width .22s,height .22s,background .22s}
#cd{width:5px;height:5px;border-radius:50%;background:#ffffff;box-shadow:0 0 8px rgba(255,255,255,.85);transition:opacity .3s}
#cr.on,#cd.on{opacity:1}
#cr.hot{width:52px;height:52px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.07))}
@media (hover:none),(pointer:coarse){#cr,#cd{display:none}}
@media (hover:hover) and (pointer:fine){*,*:hover{cursor:none!important}}
@media (prefers-reduced-motion:reduce){.ico,#dock,#pf{transition:none}}

#cr,#cd{display:none!important}
#crossCursor{
  position:fixed;
  left:0;
  top:0;
  z-index:99999;
  pointer-events:none;
  user-select:none;
  opacity:0;
  color:#fff;
  font-family:"Times New Roman",serif;
  font-size:26px;
  line-height:1;
  transform:translate(-50%,-50%);
  text-shadow:0 0 8px rgba(255,255,255,.55);
  transition:opacity .15s ease,color .15s ease,transform .15s ease;
}
#crossCursor.on{opacity:1}
#crossCursor.hot{
  color:#aaa;
  transform:translate(-50%,-50%) scale(1.15);
  text-shadow:0 0 8px rgba(255,255,255,.25);
}
@media (hover:none),(pointer:coarse){#crossCursor{display:none}}
@media (hover:hover) and (pointer:fine){*,*:hover{cursor:none!important}}
</style>

/* ---------- sound: soft synthesized UI sounds + remembered mute ---------- */

applyMute();

/* ---------- ascii banner ---------- */
var ART=[
"█▓▄▄         ▄▄       █▓▄▄          █▓▒▄▄ ▄▄▒▓█       ▄▄   ",
"▓▒░█▀▀▄▄▄   ▓▒░▀▀▄▄   ▓▒░█▀  ▐▒▌   ▐▓▒░█   █░▒▓▌     ▓▒░█  ",

"  ▀▀▀▀▀▀▀     ▀▀▀▀▀      ▀▀▀       ▀▀▀▀▀   ▀▀▀▀▀    ▀▀   ▀ "
];
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var info=document.getElementById("info"),dock=document.getElementById("dock");
var pf=document.getElementById("pf"),pfa=document.getElementById("pfa"),pfd=document.getElementById("pfd"),pfi=document.getElementById("pfi"),pfc=document.getElementById("pfc"),cr=document.getElementById("cr"),cd=document.getElementById("cd"),bgimg=document.getElementById("bgimg");
var PET=[],fa=0,ft=0,asciiReady=false,px=0,py=0,rx=0,ry=0,cur=0;
var W,H,cw,ch,S,A=[],mx=-9999,my=-9999,sx=0,sy=0,t=0,last=performance.now();
var entered=false,ay=0,ap=0,ayT=0,pcyV=0;

function initPet(){
  var n=Math.max(16,Math.min(38,Math.round(W/38))),C=["#ffffff","#dcdcdc","#f0f0f0","#bcbcbc"];PET=[];
  for(var i=0;i<n;i++)PET.push({x:Math.random()*W,y:Math.random()*H,s:4+Math.random()*5,vy:.5+Math.random()*.9,vr:(Math.random()-.5)*.03,r:Math.random()*6.28,sw:.6+Math.random()*.9,ph:Math.random()*6.28,a:.35+Math.random()*.45,c:C[i%4]});
}
function buildArt(){
  A=[];
  ART.forEach(function(l,r){for(var c=0;c<l.length;c++){if(l[c]===" ")continue;
    A.push({c:l[c],col:c,row:r,x:W/2,y:H/2,vx:0,vy:0,g:0,hx:0,hy:0});}});
}
function fit(){
  var top=pcyV+S*.5+H*.012;info.style.top=top+"px";info.style.transform="none";
  var k=Math.min(1,(H-top-98)/Math.max(1,info.scrollHeight));
  info.style.transform="scale("+Math.max(.45,k)+")";
}

  var cols=0,rows=ART.length;ART.forEach(function(l){if(l.length>cols)cols=l.length});
  cw=Math.max(3,Math.min(10,W*.7/cols,H*.17/(rows*1.65)));ch=cw*1.65;
  A.forEach(function(p){p.bx=(p.col-cols/2)*cw;p.by=(p.row-rows/2)*ch;});

  var artH=rows*ch;ayT=H*.04+artH/2;pcyV=ayT+artH/2+H*.025+S*.5;
  pf.style.width=pf.style.height=S+"px";pf.style.left=(W/2-S/2)+"px";pf.style.top=(pcyV-S/2)+"px";

}

  W=innerWidth;H=innerHeight;var d=Math.min(devicePixelRatio||1,1.25);

  var dm=Math.pow(.9,dt);p.vx*=dm;p.vy*=dm;p.x+=p.vx*dt;p.y+=p.vy*dt;

  ctx.font=(cw*.85)+"px monospace";
  for(i=0;i<A.length;i++){p=A[i];
    step(p,p.hx+Math.sin(t*1.4+p.hx*.018+p.hy*.012)*4+ox*.5,p.hy+Math.cos(t*1.1+p.hy*.02+p.hx*.009)*3+oy*.5,dt);

/* music */
bg.volume=1;

/* ascii version of the pfp (back side of the flip) */
function loadImg(src){return new Promise(function(res){var i=new Image();i.crossOrigin="anonymous";i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src;});}
function buildAscii(avUrl,decoUrl){
  asciiReady=false;
  Promise.all([loadImg(avUrl),decoUrl?loadImg(decoUrl):Promise.resolve(null)]).then(function(im){
    if(!im[0])return;
    var N=256,c=document.createElement("canvas");c.width=N;c.height=N;var g=c.getContext("2d");
    var inner=N/1.2,off=(N-inner)/2;
    g.save();g.beginPath();g.arc(N/2,N/2,inner/2,0,Math.PI*2);g.clip();g.drawImage(im[0],off,off,inner,inner);g.restore();
    if(im[1])g.drawImage(im[1],0,0,N,N);
    var data;try{data=g.getImageData(0,0,N,N).data}catch(e){return}
    var PC=48,PR=29,RAMP=" .:-=+*#%@",Z=pfc.width,o=pfc.getContext("2d"),cwp=N/PC,chp=N/PR,cz=Z/PC;
    o.clearRect(0,0,Z,Z);o.font=(cz*1.5)+"px monospace";o.textBaseline="top";
    for(var r=0;r<PR;r++)for(var col=0;col<PC;col++){
      var rr=0,gg=0,bb=0,aa=0,k=0;
      for(var y=Math.floor(r*chp);y<Math.floor((r+1)*chp);y+=2)for(var x=Math.floor(col*cwp);x<Math.floor((col+1)*cwp);x+=2){var i=(y*N+x)*4;rr+=data[i];gg+=data[i+1];bb+=data[i+2];aa+=data[i+3];k++}
      if(!k)continue;aa/=k;if(aa<90)continue;rr/=k;gg/=k;bb/=k;
      var lum=(.299*rr+.587*gg+.114*bb)/255,ch2=RAMP[Math.min(9,Math.floor((.18+.82*lum)*10))];
      o.fillStyle="rgb("+Math.min(255,rr*1.25|0)+","+Math.min(255,gg*1.25|0)+","+Math.min(255,bb*1.25|0)+")";
      o.fillText(ch2,col*cz,r*cz*1.65);
    }
    asciiReady=true;
  });
}

/* lanyard */
var acts=document.getElementById("acts"),lastKey="";
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function actImg(a){
  var i=a.assets&&a.assets.large_image;if(!i)return null;
  if(i.indexOf("mp:external/")===0)return "https://media.discordapp.net/external/"+i.slice(12);
  if(i.indexOf("mp:")===0)return "https://media.discordapp.net/"+i.slice(3);
  if(i.indexOf("spotify:")===0)return "https://i.scdn.co/image/"+i.slice(8);
  return a.application_id?"https://cdn.discordapp.com/app-assets/"+a.application_id+"/"+i+".png":null;
}
var TYPES=["Playing","Streaming","Listening to","Watching","","Competing in"];
function render(d){
  var u=d.discord_user;if(!u)return;
  var name=u.global_name||u.display_name||u.username;
  document.getElementById("dn").textContent=name;
  document.getElementById("un").textContent="@"+u.username;
  document.getElementById("dot").className="dot "+(d.discord_status||"offline");
  document.title="@"+u.username;
  var hint=document.getElementById("hint");if(!entered)hint.textContent="click · pwned by @"+u.username;

  /* real avatar (animated if it's a gif avatar) + real decoration on top */
  var ext=u.avatar&&u.avatar.indexOf("a_")===0?"gif":"png";
  var av=u.avatar?"https://cdn.discordapp.com/avatars/"+u.id+"/"+u.avatar+"."+ext+"?size=256":"https://cdn.discordapp.com/embed/avatars/0.png";
  var dd=u.avatar_decoration_data,deco=dd&&dd.asset?"https://cdn.discordapp.com/avatar-decoration-presets/"+dd.asset+".png?size=256&passthrough=true":"";
  if(av+deco!==lastKey){
    lastKey=av+deco;pfa.src=av;buildAscii(av,deco);
    if(deco){pfd.src=deco;pfd.style.display="block"}else{pfd.removeAttribute("src");pfd.style.display="none"}
  }

  acts.innerHTML="";
  (d.activities||[]).slice(0,3).forEach(function(a){
    if(a.type===4){var s=(a.emoji&&a.emoji.name?a.emoji.name+" ":"")+(a.state||"");if(s.trim())acts.appendChild(el("div","cs glass",s));return;}
    var card=el("div","act glass"),im=actImg(a);
    if(a.name==="Spotify"&&d.spotify&&d.spotify.album_art_url)im=d.spotify.album_art_url;
    if(im){var i=el("img");i.src=im;i.alt="";card.appendChild(i);}
    var tx=el("div","t");tx.appendChild(el("b","",((TYPES[a.type]||"")+" "+(a.name||"")).trim()));
    if(a.details)tx.appendChild(el("span","",a.details));
    if(a.state)tx.appendChild(el("span","",a.state));
    card.appendChild(tx);acts.appendChild(card);
  });
  fit();
}
fetch("https://api.lanyard.rest/v1/users/"+ID).then(function(r){return r.json()}).then(function(j){if(j&&j.success)render(j.data)}).catch(function(){});
function connect(){
  var ws,hb;
  try{ws=new WebSocket("wss://api.lanyard.rest/socket");}catch(e){return;}
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.op===1){hb=setInterval(function(){ws.send(JSON.stringify({op:3}))},m.d.heartbeat_interval);ws.send(JSON.stringify({op:2,d:{subscribe_to_id:ID}}));}
    else if(m.op===0&&m.d)render(m.d);
  };
  ws.onclose=function(){clearInterval(hb);setTimeout(connect,3000)};
}
connect();
pf.addEventListener("mouseenter",sHover);
pf.addEventListener("click",function(){if(!entered||!asciiReady)return;ft=ft?0:180;sClick()});

/* click: reveal pfp, info and dock */
document.addEventListener("click",function(){
  if(entered)return;entered=true;sClick();
  document.getElementById("hint").classList.add("off");
  pf.classList.add("in");info.classList.add("in");dock.classList.add("in");bgimg.classList.add("in");
},{passive:true});
})();
</script>
